name:        Question
description: Ask for support or start a discussion
title:       Think about the title, twice
labels:      question

body:
  - type: markdown
    id: intro
    attributes:
      value: |
        ## Please fill out the form completely. Incomplete submissions will be closed!
        #### Make sure that you have:
        - provided a descriptive and succinct title
        - have read all questions carefully have answered **all** of them

  - type: checkboxes
    id: version
    attributes:
      label: Are you using the latest augra-log version?
      description: |
        Look up the latest release version on the [releases page](https://github.com/augra-project/augra-log/releases).
      options:
        - label: I have checked and I'm using the latest release.
          required: true
  - type: input
    id: verinfo
    attributes:
      label: Different version than latest?
      placeholder: "E.g., 0.3.0-alpha, git version, branch testing"
    validations:
      required: false

  - type: textarea
    id: build_environment
    attributes:
      label: Build environment
      description: |
        What is the build environment you are using?

        Please add version information of your C++ compiler, language level,
        and build tools if relevant to your question.
      placeholder: "Paste command output or describe your build environment"
    validations:
      required: false

  - type: textarea
    id: question
    attributes:
      label: What is your question and how can we help?
      placeholder: "How do I ..."
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Contributing guidelines
      description: By submitting this issue, you agree to follow our [contributing guidelines](https://github.com/augra-project/augra-log/blob/main/CONTRIBUTING.md).
      options:
        - label: Yes, I agree.
          required: true
