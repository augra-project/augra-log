name:        Feature request
description: Suggest an idea (a new feature or other improvement)
title:       Think about the title, twice
labels:      enhancement
type:        feature

body:
  - type: markdown
    id: intro
    attributes:
      value: |
        ## Please fill out the form completely. Incomplete submissions will be closed!
        #### Make sure that you have:
        - provided a descriptive and succinct title
        - have read all questions carefully have answered **all** of them

  - type: checkboxes
    id: version
    attributes:
      label: Are you using the latest augra-log version?
      description: |
        Look up the latest release version on the [releases page](https://github.com/augra-project/augra-log/releases).
      options:
        - label: I have checked and I'm using the latest release.
          required: true
  - type: input
    id: verinfo
    attributes:
      label: Different version than latest?
      placeholder: "E.g., 0.3.0-alpha, git version, branch testing"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: What operating system are you using?
      multiple: false
      options:
        - Please select
        - Linux x86_64
        - Windows 11
        - Windows 10
        - Windows 8
        - Windows 7
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Other
    validations:
      required: true
  - type: textarea
    id: other_os
    attributes:
      label: OS details
      description: |
        Don't worry about getting every detail right. Whatever you can provide helps.

        On Linux, this collects the useful bits:
        ```
        cat /etc/os-release | head -4
        ```

        On Windows, open a command prompt and run:
        ```
        systeminfo | findstr /B /C:"OS Name" /C:"OS Version" /C:"System Type"
        ```

        If you can't run these, just describe what you know. That's fine too.
      placeholder: "Paste command output or describe your setup"
    validations:
      required: false
  - type: textarea
    id: build_environment
    attributes:
      label: Build environment
      description: |
        What is the build environment you are using?

        Please add version information of your C++ compiler, language level,
        build tools etc.

        If your software tools have a --version parameter, it is useful to
        include this here.
      placeholder: "Paste command output or describe your build environment"
    validations:
      required: false

  - type: textarea
    id: related
    attributes:
      label: Is your feature request related to a problem? Please describe.
      placeholder: "E.g., I would love if augra-log could do ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      placeholder: "How can we make things better?"
    validations:
      required: false
  - type: textarea
    id: alternative
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: "Similar idea or software"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Add any other context or screenshots about the feature request here
      placeholder: "Screenshots, links, mockups, etc."
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Contributing guidelines
      description: By submitting this issue, you agree to follow our [contributing guidelines](https://github.com/augra-project/augra-log/blob/main/docs/CONTRIBUTING.md).
      options:
        - label: Yes, I agree.
          required: true
